name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ binutils meson ninja-build qemu-system-x86
        
    - name: Build kernel
      run: |
        meson setup build --cross-file=cross/x86_64-none.ini
        meson compile -C build
