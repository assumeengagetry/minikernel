name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ binutils meson ninja-build \
            grub-pc-bin xorriso qemu-system-x86

      - name: Build kernel
        run: |
          make check-tools
          make all

      - name: Validate kernel image
        run: |
          grub-file --is-x86-multiboot build/kernel.elf
          test -z "$(nm -u build/kernel.elf)"

      - name: Boot QEMU
        run: make qemu-smoke
